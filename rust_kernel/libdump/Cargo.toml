[package]
name = "libdump"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
windows = { version = "0.62", features = [
    "Win32_System_Diagnostics_Debug",
    "Win32_System_Threading",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_ErrorReporting",
    "Win32_System_Kernel",
    "Win32_System_Memory",
] }

once_cell = "1.20.0"